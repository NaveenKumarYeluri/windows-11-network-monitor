name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [ Release ]
        rid: [ win-x64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (WinUI XAML compiler needs full-framework MSBuild, not Core MSBuild)
        uses: microsoft/setup-msbuild@v2

      - name: Verify SDK (must be 8.x via global.json)
        run: |
          dotnet --version
          $v = dotnet --version
          if ($v -notmatch '^8\.') { throw "Expected .NET 8 SDK but got $v — check global.json" }

      - name: Restore
        run: dotnet restore Windows11NetworkMonitor.sln

      - name: Build (MSBuild.exe for WinUI XAML)
        run: msbuild Windows11NetworkMonitor.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /m /verbosity:m

      - name: Dump XAML diagnostics (on failure)
        if: failure()
        run: |
          Write-Host "=== output.json files ==="
          Get-ChildItem -Recurse "src/Windows11NetworkMonitor/obj" -Filter "output.json" | ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName -ErrorAction SilentlyContinue }
          Write-Host "=== XamlSaveStateFile ==="
          Get-ChildItem -Recurse "src/Windows11NetworkMonitor/obj" -Filter "XamlSaveStateFile.xml" | ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -First 300 }

      - name: Publish self-contained (folder, not single-file - SxS fix for unpackaged WinUI)
        run: msbuild src/Windows11NetworkMonitor/Windows11NetworkMonitor.csproj /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true /p:PublishDir=./publish/ /t:Publish /verbosity:m

      - name: List publish output
        if: always()
        run: Get-ChildItem -Recurse src/Windows11NetworkMonitor/publish -ErrorAction SilentlyContinue | Format-Table FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows11NetworkMonitor-${{ matrix.rid }}-${{ github.sha }}
          path: src/Windows11NetworkMonitor/publish/
          if-no-files-found: error
