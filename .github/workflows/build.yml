name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [ Release ]
        rid: [ win-x64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify SDK (must be 8.x via global.json)
        run: |
          dotnet --list-sdks
          dotnet --version
          $v = dotnet --version
          if ($v -notmatch '^8\.') { throw "Expected .NET 8 SDK but got $v — check global.json" }

      - name: Restore
        run: dotnet restore Windows11NetworkMonitor.sln

      - name: Build
        run: dotnet build Windows11NetworkMonitor.sln --configuration ${{ matrix.configuration }} --no-restore --nologo -v d

      - name: Dump XAML compiler output (on failure)
        if: failure()
        run: |
          Get-ChildItem -Recurse "src/Windows11NetworkMonitor/obj" -Filter "output.json" | ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName }

      - name: Test (if present)
        run: |
          $tests = Get-ChildItem -Recurse -Filter "*Tests*.csproj"
          if ($tests) { dotnet test Windows11NetworkMonitor.sln --configuration ${{ matrix.configuration }} --no-build --nologo } else { Write-Host "No test projects found, skipping." }

      - name: Publish single-file
        run: dotnet publish src/Windows11NetworkMonitor/Windows11NetworkMonitor.csproj --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish --nologo -v m

      - name: List publish output
        if: always()
        run: Get-ChildItem -Recurse ./publish -ErrorAction SilentlyContinue | Format-Table FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows11NetworkMonitor-${{ matrix.rid }}-${{ github.sha }}
          path: ./publish/
          if-no-files-found: error
