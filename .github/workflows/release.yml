name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Windows11NetworkMonitor.sln

      - name: Publish single-file
        run: dotnet publish src/Windows11NetworkMonitor/Windows11NetworkMonitor.csproj --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish --nologo

      - name: Zip release package
        run: Compress-Archive -Path ./publish/* -DestinationPath ./windows-11-network-monitor-${{ github.ref_name }}-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./windows-11-network-monitor-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
