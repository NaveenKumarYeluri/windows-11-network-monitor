name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (WinUI XAML compiler needs full-framework MSBuild)
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore Windows11NetworkMonitor.sln

      - name: Publish self-contained folder (same as build.yml — single-file WinUI crashes with 0x80040111)
        run: msbuild src/Windows11NetworkMonitor/Windows11NetworkMonitor.csproj /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true /p:PublishDir=./publish/ /t:Publish /verbosity:m

      - name: Zip release package
        # PublishDir is relative to the project dir (msbuild behavior), so the
        # output lands in src/Windows11NetworkMonitor/publish — not repo root.
        run: Compress-Archive -Path ./src/Windows11NetworkMonitor/publish/* -DestinationPath ./windows-11-network-monitor-${{ github.ref_name }}-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./windows-11-network-monitor-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
